# foot terminal - setupde (Catppuccin Mocha). Reference: man 5 foot.ini
font=DejaVu Sans Mono:size=11, Symbols Nerd Font:size=11
pad=10x10

[scrollback]
lines=10000

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=0.95
foreground=cdd6f4
background=1e1e2e
regular0=45475a
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=89b4fa
regular5=f5c2e7
regular6=94e2d5
regular7=bac2de
bright0=585b70
bright1=f38ba8
bright2=a6e3a1
bright3=f9e2af
bright4=89b4fa
bright5=f5c2e7
bright6=94e2d5
bright7=a6adc8
selection-foreground=cdd6f4
selection-background=414356
urls=89b4fa

[key-bindings]
search-start=Control+Shift+f
