# Gaming sysctl tweaks - installed by setupde gaming.sh to /etc/sysctl.d/
# (similar to what CachyOS / SteamOS ship)

# Some games (many via Proton, e.g. DayZ, Hogwarts Legacy, CS2) need lots of memory maps
vm.max_map_count = 2147483642

# Don't slow down games that trigger split locks (SteamOS does the same)
kernel.split_lock_mitigate = 0

# Less background work
kernel.nmi_watchdog = 0

# Tuned for zram swap (fast compressed RAM swap set up by zramen)
vm.swappiness = 100
vm.page-cluster = 0
vm.vfs_cache_pressure = 50

# Write dirty data in smaller chunks so big writes don't cause stutter
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
