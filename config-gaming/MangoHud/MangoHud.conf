# MangoHud overlay - setupde. Start a game with:  mangohud %command%  (Steam launch options)
# Toggle the overlay in-game: Right Shift + F12
toggle_hud=Shift_R+F12
legacy_layout=false
horizontal
hud_compact
round_corners=8
background_alpha=0.6
background_color=1e1e2e
text_color=cdd6f4
font_size=18
position=top-left

fps
frametime
frame_timing
gpu_stats
gpu_temp
cpu_stats
cpu_temp
ram
vram
gamemode
fps_limit_method=late
